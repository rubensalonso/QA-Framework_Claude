# Pipeline de calidad.
#   - Pull requests: lint + tipado + smoke (rápido, bloquea el merge si falla).
#   - Push a main y nightly: regresión completa en Chromium y Firefox + performance.
#   - Manual (workflow_dispatch): permite elegir marker y navegador.
name: tests

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * 1-5"   # nightly, días hábiles 05:00 UTC
  workflow_dispatch:
    inputs:
      marker:
        description: "Expresión de markers (-m). Ej: smoke, api, 'ui and not e2e'"
        default: "regression"
      browser:
        description: "Navegador"
        type: choice
        options: [chromium, firefox, webkit]
        default: chromium

# Si se pushea de nuevo a la misma rama, se cancela la corrida anterior (ahorra minutos de CI).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Runner fijado (no ubuntu-latest): el 19/10/2026 "latest" pasa a Ubuntu 26 y podría romper
  # `playwright install --with-deps`. Migrar a propósito, en un PR propio, no por sorpresa.
  PYTHON_VERSION: "3.12"
  # Paralelismo BAJO a propósito: el SUT es un sitio público con WAF que bloquea ráfagas.
  XDIST_WORKERS: "2"

jobs:
  lint:
    name: Lint, tipado y unit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lockfiles al día con los .in
        run: python scripts/compile_requirements.py --check
      - uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      # Los mismos hooks que corren localmente antes de cada commit (ruff, mypy, higiene de archivos):
      # una única definición de "código válido" para la máquina del desarrollador y el CI.
      - name: Hooks de pre-commit
        run: pre-commit run --all-files --show-diff-on-failure
      - name: Tests unitarios del framework
        run: pytest -m unit

  api:
    name: API
    needs: lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      # La suite API usa Playwright solo como cliente HTTP: no necesita navegadores.
      - name: Ejecutar tests de API
        # `security` se excluye de las corridas automáticas: el WAF del sitio banea IPs que envían
        # payloads de ataque repetidos. Se ejecutan a demanda con workflow_dispatch (marker=security).
        run: >
          pytest -m "api and not performance and not security"
          -n ${{ env.XDIST_WORKERS }}
          --reruns 1 --reruns-delay 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-reports
          path: |
            reports/
            logs/
          retention-days: 14

  ui:
    name: UI (${{ matrix.browser }})
    needs: lint
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false   # que un navegador falle no cancela el otro: queremos ver ambos resultados
      # Un navegador a la vez: en paralelo serían 4 navegadores contra un sitio público, y en la
      # primera corrida el sitio respondió "under heavy load (queue full)".
      max-parallel: 1
      matrix:
        # Manual → el navegador elegido | PR → solo Chromium (rápido) | push/nightly → Chromium + Firefox.
        browser: >-
          ${{ github.event_name == 'workflow_dispatch' && fromJSON(format('["{0}"]', inputs.browser))
          || github.event_name == 'pull_request' && fromJSON('["chromium"]')
          || fromJSON('["chromium","firefox"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps ${{ matrix.browser }}
      - name: Elegir suite
        id: suite
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "marker=smoke and ui" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "marker=${{ inputs.marker }} and ui" >> "$GITHUB_OUTPUT"
          else
            echo "marker=regression and ui and not security" >> "$GITHUB_OUTPUT"
          fi
      - name: Ejecutar tests de UI
        # --reruns: SOLO en CI y con 1 reintento. Un test que necesita reintentos se reporta
        # como "rerun" en el resumen: es una señal de flakiness a investigar, no a ocultar.
        run: >
          pytest -m "${{ steps.suite.outputs.marker }}"
          --browser ${{ matrix.browser }}
          -n ${{ env.XDIST_WORKERS }}
          --reruns 1 --reruns-delay 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-reports-${{ matrix.browser }}
          path: |
            reports/
            test-results/
            logs/
          retention-days: 14

  ui-mobile:
    name: UI móvil (Pixel 7)
    needs: lint
    # Solo nightly y manual: suma tráfico contra un sitio público, no hace falta en cada push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      # Smoke de UI completo + tests específicos de móvil, con el perfil de dispositivo de Playwright
      # (viewport, user agent, densidad de píxeles y eventos táctiles).
      - name: Ejecutar smoke en móvil
        run: >
          pytest -m "(smoke and ui) or mobile"
          --browser chromium --device "Pixel 7"
          -n ${{ env.XDIST_WORKERS }}
          --reruns 1 --reruns-delay 5
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-reports-mobile
          path: |
            reports/
            test-results/
            logs/
          retention-days: 14

  performance:
    name: Performance
    needs: [api, ui]
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium
      # Secuencial (sin -n): el paralelismo distorsiona las mediciones de tiempo.
      - name: Web vitals y SLA de API
        run: pytest -m performance --alluredir=reports/allure-results-perf
      - name: Prueba de carga (Locust, límites conservadores)
        run: locust --config performance/load/locust.conf
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: performance-reports
          path: reports/
          retention-days: 30

  allure-report:
    name: Reporte Allure
    needs: [api, ui, ui-mobile, performance]
    # always(): el reporte se genera aunque haya fallos (es justamente cuando más se necesita),
    # y aunque ui-mobile/performance no hayan corrido (push sin nightly).
    if: always() && needs.api.result != 'cancelled'
    runs-on: ubuntu-24.04
    outputs:
      publish: ${{ steps.publish.outputs.enabled }}
    env:
      ALLURE_VERSION: "2.46.1"
    steps:
      - name: ¿Publicar en Pages?
        id: publish
        # Solo main (push, nightly o manual): los PRs no deben pisar el reporte público ni su historial.
        run: echo "enabled=${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v8
        with:
          pattern: "*-reports*"
          path: downloaded
      - name: Unificar resultados
        run: |
          mkdir -p allure-results
          find downloaded -path "*allure-results*" -type f -exec cp {} allure-results/ \;
      - name: Recuperar historial del reporte publicado
        # Allure calcula tendencias y detecta tests flaky comparando con corridas anteriores. Ese
        # historial vive en el propio sitio publicado: se descarga antes de generar el reporte nuevo.
        # En la primera publicación no existe (404) y simplemente se arranca sin historial.
        run: |
          mkdir -p allure-results/history
          base="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/history"
          for f in history.json history-trend.json duration-trend.json retry-trend.json categories-trend.json; do
            curl -sfL "$base/$f" -o "allure-results/history/$f" || rm -f "allure-results/history/$f"
          done
          ls allure-results/history
      - name: Datos de la ejecución (executor)
        # Agrega al reporte el link a la corrida de CI y numera los builds en las tendencias.
        run: |
          cat > allure-results/executor.json <<JSON
          {"name": "GitHub Actions", "type": "github",
           "buildName": "#${{ github.run_number }} (${{ github.event_name }})",
           "buildOrder": ${{ github.run_number }},
           "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
           "reportUrl": "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"}
          JSON
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Generar reporte
        # Versión fijada y descargada del release oficial (no `npm install` sin versión).
        run: |
          curl -sfL "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz" | tar -xz
          "./allure-${ALLURE_VERSION}/bin/allure" generate allure-results --clean -o allure-report
      - uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
          retention-days: 30
      - name: Preparar sitio de Pages
        if: steps.publish.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  publish-report:
    name: Publicar reporte en Pages
    needs: allure-report
    if: always() && needs.allure-report.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    # Permisos mínimos y solo en este job: el resto del pipeline no puede escribir en Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    # Dos publicaciones simultáneas no se pisan: la nueva espera a que termine la anterior.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
